    <meta name="theme-color" content="#FAF3E7" />
    <!-- SVG first for anything modern, PNGs behind it for everything else. -->

    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />

    <link rel="manifest" href="/manifest.webmanifest" />

         its own tags. Added to the home screen, the site opens without any
         browser chrome, which is the only route to fullscreen on iPhone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="for you 🤍" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
